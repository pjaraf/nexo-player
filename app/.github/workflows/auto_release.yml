name: Build and Auto-Release Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK and Extract Version Info
        id: info
        run: |
          # Find gradle file
          GRADLE_FILE="build.gradle.kts"
          if [ -f "app/build.gradle.kts" ]; then
            GRADLE_FILE="app/build.gradle.kts"
          fi

          VERSION_CODE=$(grep -E 'versionCode\s*=\s*[0-9]+' "$GRADLE_FILE" | head -n 1 | grep -oE '[0-9]+' || echo "1")
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"[^"]+"' "$GRADLE_FILE" | head -n 1 | cut -d'"' -f2 || echo "1.0.0")

          # Find generated APK
          APK_FILE=$(find . -name "*.apk" | grep -E "debug.apk" | head -n 1 || find . -name "*.apk" | head -n 1)

          echo "Found APK at: $APK_FILE"
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Generate version.json
        run: |
          cat << EOF > version.json
          {
            "versionCode": ${{ steps.info.outputs.version_code }},
            "versionName": "${{ steps.info.outputs.version_name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.info.outputs.version_name }}/app-debug.apk",
            "changelog": "Actualización automática v${{ steps.info.outputs.version_name }} con mejoras de rendimiento y estabilidad.",
            "isMandatory": true
          }
          EOF

      - name: Commit version.json to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update version.json to v${{ steps.info.outputs.version_name }} [skip ci]"
          file_pattern: version.json

      - name: Delete existing tag/release if already exists (allows re-running on same version)
        uses: dev-drprasad/delete-tag-and-release@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.info.outputs.version_name }}
          delete_release: true
        continue-on-error: true

      - name: Publish GitHub Release for Version Tag
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.info.outputs.version_name }}
          name: "Nexo Player v${{ steps.info.outputs.version_name }}"
          body: "🚀 Lanzamiento automático de Nexo Player v${{ steps.info.outputs.version_name }} (Build ${{ steps.info.outputs.version_code }})"
          files: ${{ steps.info.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
