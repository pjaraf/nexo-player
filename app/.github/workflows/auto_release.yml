name: Build and Auto-Release Android App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Extract Version Info
        id: version
        run: |
          VERSION_CODE=$(grep -E 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -n 1 | grep -oE '[0-9]+')
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Building v$VERSION_NAME (code $VERSION_CODE)"

      - name: Generate version.json
        run: |
          cat << EOF > version.json
          {
            "versionCode": ${{ steps.version.outputs.version_code }},
            "versionName": "${{ steps.version.outputs.version_name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version_name }}/app-debug.apk",
            "changelog": "Actualización automática v${{ steps.version.outputs.version_name }} generada por GitHub Actions.",
            "isMandatory": true
          }
          EOF

      - name: Commit version.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update version.json for v${{ steps.version.outputs.version_name }}"
          file_pattern: version.json

      - name: Delete existing release/tag if exists (to allow overwrite)
        uses: dev-drprasad/delete-tag-and-release@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          delete_release: true
        continue-on-error: true

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: "Nexo Player v${{ steps.version.outputs.version_name }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
