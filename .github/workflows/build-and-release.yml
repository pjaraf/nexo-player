name: Build and Release Nexo APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore fixed signing keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "" | base64 -d > debug.keystore
          fi
          ls -la debug.keystore

      - name: Read Version from version.json
        id: get_version
        run: |
          VERSION=$(grep -o '"versionName": "[^"]*' version.json | grep -o '[^"]*$')
          VERSION_CODE=$(grep -o '"versionCode": [0-9]*' version.json | grep -o '[0-9]*$')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.8"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "Found APK file: $APK_FILE"
          
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file was generated."
            exit 1
          fi

          # If release already exists, upload the new APK; otherwise create a new release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading and replacing APK asset..."
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK_FILE" --title "Nexo Player $TAG" --generate-notes
          fi



