name: Build and Release Nexo APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Read Version from version.json
        id: get_version
        run: |
          VERSION=$(grep -o '"versionName": "[^"]*' version.json | grep -o '[^"]*$')
          VERSION_CODE=$(grep -o '"versionCode": [0-9]*' version.json | grep -o '[0-9]*$')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.2"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build APK with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.11.1
          arguments: assembleDebug --no-daemon

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Nexo Player ${{ steps.get_version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


